<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="widtd=device-widtd, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Tic-Tac-Toe</h1>
    <section class="game">
        <div class="players">
            <div class="player1 player-stats">
                <h3 class="player1 player-name">Player 1</h3>
                <p class="player1 player-score">0</p>
            </div>
            <div class="player2 player-stats">
                <h3 class="player2 player-name">Player 2</h3>
                <p class="player2 player-score">0</p>
            </div>

        </div>
            <div class="container">
        <h2 class="turn">Player #'s Turn</h3>
                <table class="board">
                    <tr class="row">
                        <td class="square" id="1"><button>+</button></td>
                        <td class="square" id="2"><button>+</button></td>
                        <td class="square" id="3"><button>+</button></td>
                    </tr>
                    <tr class="row">
                        <td class="square" id="4"><button>+</button></td>
                        <td class="square" id="5"><button>+</button></td>
                        <td class="square" id="6"><button>+</button></td>
                    </tr>
                    <tr class="row">
                        <td class="square" id="7"><button>+</button></td>
                        <td class="square" id="8"><button>+</button></td>
                        <td class="square" id="9"><button>+</button></td>
                    </tr>
                </table>
            </div>
    </section>
</body>

</html>
