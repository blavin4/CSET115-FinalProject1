<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Tic-Tac-Toe</h1>
    <section class="game">
        <div class="players">
            <div class="player1 player-stats">
                <h3 class="player1 player-name">Player 1</h3>
                <p class="player1 player-score">0</p>
            </div>
            <div class="player2 player-stats">
                <h3 class="player2 player-name">Player 2</h3>
                <p class="player2 player-score">0</p>
            </div>

        </div>
        <div class="container">
            <h2 class="status">Press Play to start</h3>
                <table class="board">
                    <tr class="row">
                        <td><button class="square" id="0"></button></td>
                        <td><button class="square" id="1"></button></td>
                        <td><button class="square" id="2"></button></td>
                    </tr>
                    <tr class="row">
                        <td><button class="square" id="3"></button></td>
                        <td><button class="square" id="4"></button></td>
                        <td><button class="square" id="5"></button></td>
                    </tr>
                    <tr class="row">
                        <td><button class="square" id="6"></button></td>
                        <td><button class="square" id="7"></button></td>
                        <td><button class="square" id="8"></button></td>
                    </tr>
                </table>
                <button class="play-button" onclick="start()">Play</button>
        </div>
    </section>
    <script src="script.js"></script>
</body>

</html>
