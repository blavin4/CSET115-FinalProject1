<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Tic-Tac-Toe</h1>
    <section>
        <div>
            <div class="player">
                <h3 class="player-name">Player 1</h3>
                <p class="player-score">0</p>
            </div>
            <div class="player">
                <h3 class="player-name">Player 2</h3>
                <p class="player-score">0</p>
            </div>
            <h3 class="turn">Player #'s Turn</h3>
            <table class="board">
                <tr class="row">
                    <th class="square" id="1">X</th>
                    <th class="square" id="2">X</th>
                    <th class="square" id="3">X</th>
                </tr>
                <tr class="row">
                    <th class="square" id="4">X</th>
                    <th class="square" id="5">X</th>
                    <th class="square" id="6">X</th>
                </tr>
                <tr class="row">
                    <th class="square" id="7">X</th>
                    <th class="square" id="8">X</th>
                    <th class="square" id="9">X</th>
                </tr>
            </table>
        </div>
    </section>
</body>
</html>
